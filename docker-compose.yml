name: iacoc-local
services:
  iacoc-web:
    build:
      context: .
      target: development
    image: iacoc:dev-0.1.0
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      DATA_MODE: ${DATA_MODE:-MOCK}
      PUBLIC_ORIGIN: http://localhost:5173
      LOCAL_HTTP: "true"
      LIVE_ENABLED: ${LIVE_ENABLED:-false}
      IACP_ALLOWED_TARGETS: ${IACP_ALLOWED_TARGETS:-[]}
      IACOC_DB_PATH: /var/lib/iacoc/iacoc.sqlite
      IACOC_KEYRING_FILE: /run/iacoc-secrets/keyring.json
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "250"
      NPM_CONFIG_CACHE: /tmp/npm-cache
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - svelte_cache:/app/.svelte-kit
      - build_output:/app/.artifacts
      - test_output:/app/test-results
      - configuration:/var/lib/iacoc
      - local_keys:/run/iacoc-secrets
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/health',{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 4s
      start_period: 15s
      retries: 3
  iacoc-tests:
    profiles: [test]
    build:
      context: .
      target: test
    image: iacoc:test-0.1.0
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      DATA_MODE: MOCK
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      NPM_CONFIG_CACHE: /tmp/npm-cache
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - test_cache:/app/.svelte-kit
      - test_build:/app/.artifacts
      - test_results:/app/test-results
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  node_modules:
  svelte_cache:
  build_output:
  test_output:
  test_cache:
  test_build:
  test_results:

  configuration:
  local_keys:
