name: iacoc-v2-local

services:
  web:
    build:
      context: ../..
      target: development
    image: iacoc-v2:web-dev
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    ports:
      - '127.0.0.1:5174:5174'
    environment:
      VITE_BFF_ORIGIN: http://bff:4100
      CHOKIDAR_USEPOLLING: 'true'
      CHOKIDAR_INTERVAL: '250'
      NPM_CONFIG_CACHE: /tmp/npm-cache
    volumes:
      - ../..:/workspace
      - iacoc_v2_node_modules:/workspace/node_modules
      - iacoc_v2_web_node_modules:/workspace/apps/web/node_modules
      - iacoc_v2_artifacts:/workspace/.artifacts
    working_dir: /workspace
    depends_on:
      bff:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  bff:
    build:
      context: ../..
      target: development
    image: iacoc-v2:bff-dev
    command: ['npm', 'run', 'dev:bff']
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    ports:
      - '127.0.0.1:4100:4100'
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4100
      PUBLIC_ORIGIN: http://localhost:5174
      IACOC_V2_DB_PATH: /var/lib/iacoc-v2/iacoc.sqlite
      IACP_ALLOWED_TARGETS: ${IACP_ALLOWED_TARGETS:-[]}
      IACP_TIMEOUT_MS: ${IACP_TIMEOUT_MS:-10000}
      IACP_MAX_RESPONSE_BYTES: ${IACP_MAX_RESPONSE_BYTES:-1048576}
      LIVE_ENABLED: ${LIVE_ENABLED:-false}
      NPM_CONFIG_CACHE: /tmp/npm-cache
    volumes:
      - ../..:/workspace
      - iacoc_v2_node_modules:/workspace/node_modules
      - iacoc_v2_bff_node_modules:/workspace/apps/bff/node_modules
      - iacoc_v2_data:/var/lib/iacoc-v2
      - iacoc_v2_keyring:/run/iacoc-secrets
    working_dir: /workspace
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4100/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 15
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  runner:
    profiles: [test]
    build:
      context: ../..
      target: test
    image: iacoc-v2:runner
    user: '${LOCAL_UID:-1000}:${LOCAL_GID:-1000}'
    environment:
      NODE_ENV: test
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
      NPM_CONFIG_CACHE: /tmp/npm-cache
    volumes:
      - ../..:/workspace
      - iacoc_v2_node_modules:/workspace/node_modules
      - iacoc_v2_test_results:/workspace/test-results
    working_dir: /workspace
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  iacp-mock:
    profiles: [test]
    image: node:22-bookworm-slim
    working_dir: /workspace
    command: ['node', 'tests/mocks/iacp-server.mjs']
    volumes:
      - ../..:/workspace:ro
    expose:
      - '9100'

volumes:
  iacoc_v2_node_modules:
  iacoc_v2_web_node_modules:
  iacoc_v2_bff_node_modules:
  iacoc_v2_artifacts:
  iacoc_v2_data:
  iacoc_v2_keyring:
  iacoc_v2_test_results:
