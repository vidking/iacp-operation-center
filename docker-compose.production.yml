name: iacoc-production-local
services:
  iacoc-web:
    build:
      context: .
      target: production
      args:
        APP_VERSION: 0.6.3-rc.7
        VCS_REF: local-review
    image: ${IACOC_LOCAL_IMAGE:-iacoc:0.6.3-rc.7-local}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PUBLIC_ORIGIN: http://localhost:3000
      LOCAL_HTTP: "true"
      LIVE_ENABLED: ${LIVE_ENABLED:-false}
      IACP_ALLOWED_TARGETS: ${IACP_ALLOWED_TARGETS:-[]}
      IACOC_DB_PATH: /var/lib/iacoc/iacoc.sqlite
      IACOC_KEYRING_FILE: /run/iacoc-secrets/keyring.json
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      BODY_SIZE_LIMIT: "16384"
    volumes:
      - configuration:/var/lib/iacoc
      - local_keys:/run/iacoc-secrets
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  configuration:
  local_keys:
