name: iacoc-production-local
services:
  iacoc-web:
    build:
      context: .
      target: production
      args:
        APP_VERSION: 0.1.0
        VCS_REF: local-review
    image: iacoc:0.1.0-local
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATA_MODE: MOCK
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
